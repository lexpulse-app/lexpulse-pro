name: Sincronizare Automata Portal Just

on:
  schedule:
    # Ruleaza de luni pana vineri la 06:30, 10:30 si 14:30 UTC (08:30, 12:30, 16:30 ora Romaniei)
    - cron: '30 6 * * 1-5'
    - cron: '30 10 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  sync-dosare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza dependente
        run: pip install -r requirements.txt

      - name: Rulare sincronizare Portal Just -> Claude -> Email & Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: "Errata <alerte@errata.ro>"
        run: |
          python -c "import baza_date, app; baza_date.init_db(); nr = app.sincronizeaza_toate_dosarele(); print(f'Sincronizare automata finalizata. Actualizari: {nr}')"
